name: Multi-Platform Cloud Build Fixed

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  # 1. 编译 Android 手机端与 TV 电视端
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [simple_live_app, simple_live_tv_app]
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.0'
        channel: 'stable'
        cache: true

    # 优先解析核心公共依赖库，防止主程序找不到本地包
    - name: Pre-install core dependencies
      run: |
        if [ -d "simple_live_core" ]; then
          cd simple_live_core && flutter pub get && cd ..
        fi

    - name: Build APK
      run: |
        cd ${{ matrix.folder }}
        flutter pub get
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.folder }}-apk
        path: ${{ matrix.folder }}/build/app/outputs/flutter-apk/app-release.apk

  # 2. 编译 Windows 电脑端
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    # 自动配置 Windows 打包所需的 C++ 编译工具链
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.0'
        channel: 'stable'
        cache: true

    - name: Pre-install core dependencies (Windows)
      shell: bash
      run: |
        if [ -d "simple_live_core" ]; then
          cd simple_live_core && flutter pub get && cd ..
        fi

    - name: Build Windows Desktop
      shell: bash
      run: |
        cd simple_live_app
        flutter config --enable-windows-desktop
        flutter pub get
        flutter build windows --release

    # Windows 产物是文件夹，将其自动压缩为 zip 方便直接下载使用
    - name: Archive Production
      shell: bash
      run: |
        cd simple_live_app/build/windows/x64/runner/
        compress-archive -Path Release/* -DestinationPath ../../../../simple-live-windows.zip
      interpreter: powershell

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simple-live-windows-x64
        path: simple-live-windows.zip
